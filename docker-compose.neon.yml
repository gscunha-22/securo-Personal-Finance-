# Overlay for persistent compute against Neon Postgres + S3-compatible vault.
# Does not git-deploy. Secrets stay in the environment, never in this file.
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.neon.yml up -d
#
# Requires DATABASE_URL (Neon -pooler) and DATABASE_URL_DIRECT (compute).
# Redis stays in this compose unless REDIS_URL is overridden. The SPA may
# remain the bundled nginx frontend here, or sit on Vercel with API_ORIGIN
# pointing at this API. Disable the local Postgres profile unless you
# explicitly want it: --profile local-postgres.

services:
  db:
    profiles: ["local-postgres"]

  backend:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Neon pooled DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?set the Neon direct DATABASE_URL_DIRECT}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-2}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      PRIVATE_INSTANCE: ${PRIVATE_INSTANCE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

  celery-worker:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Neon pooled DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?set the Neon direct DATABASE_URL_DIRECT}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-2}
      STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      PRIVATE_INSTANCE: ${PRIVATE_INSTANCE:-true}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}

  celery-beat:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?set the Neon pooled DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?set the Neon direct DATABASE_URL_DIRECT}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      PRIVATE_INSTANCE: ${PRIVATE_INSTANCE:-true}
